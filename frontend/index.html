<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>NeuralBI Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.global = window;
      window.process = { env: {} };
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = '<div style="background:red;color:white;padding:20px;font-family:monospace;height:100vh;">' +
          '<h1>RAW BROWSER ERROR</h1>' +
          '<p>Message: ' + message + '</p>' +
          '<p>Source: ' + source + ':' + lineno + ':' + colno + '</p>' +
          '<pre>' + (error ? error.stack : '') + '</pre>' +
          '</div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="background:red;color:white;padding:20px;font-family:monospace;height:100vh;">' +
          '<h1>RAW PROMISE ERROR</h1>' +
          '<pre>' + (event.reason ? (event.reason.stack || event.reason.message || event.reason) : 'Unknown promise rejection') + '</pre>' +
          '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
