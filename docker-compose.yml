version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MySQL123
      POSTGRES_DB: aibi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/aibi
      - DB_USER=postgres
      - DB_PASSWORD=MySQL123
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      # Add your GEMINI_API_KEY and GOOGLE_CLIENT_SECRET here for docker local usage
      - GEMINI_API_KEY=
      - GOOGLE_CLIENT_SECRET=
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    environment:
      # Nginx doesn't read env vars directly into index.html at runtime. 
      # VITE_ variables must be built into the image, so they should be passed as build args or configured in .env.
      # For docker-compose local, we will just rely on the default fallback or build args.
      - VITE_API_BASE_URL=http://localhost:8081
    depends_on:
      - backend

volumes:
  pgdata:
